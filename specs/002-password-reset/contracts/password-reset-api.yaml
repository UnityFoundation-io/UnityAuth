openapi: 3.0.3
info:
  title: UnityAuth Password Reset API
  description: |
    API endpoints for password reset workflow in UnityAuth.

    ## Security Considerations
    - All endpoints return consistent responses to prevent email enumeration
    - Rate limiting: 3 requests per email per hour
    - Tokens expire after 30 minutes
    - Tokens are single-use
  version: 1.0.0
  contact:
    name: UnityAuth Team

servers:
  - url: http://localhost:8081
    description: Local development
  - url: http://localhost:9090
    description: Docker development

tags:
  - name: Password Reset
    description: Password reset workflow endpoints

paths:
  /api/password-reset/request:
    post:
      tags:
        - Password Reset
      summary: Request password reset
      description: |
        Initiates the password reset workflow by sending an email with a reset link.

        **Security Notes:**
        - Returns success even if email doesn't exist (prevents enumeration)
        - Rate limited to 3 requests per email per hour
        - Previous unused tokens for this user are invalidated
      operationId: requestPasswordReset
      security: []  # Public endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            examples:
              valid:
                summary: Valid request
                value:
                  email: "user@example.com"
      responses:
        '200':
          description: Request accepted (always returns success for security)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetRequestResponse'
              examples:
                success:
                  value:
                    message: "If an account exists with this email, a password reset link has been sent."
        '400':
          description: Invalid request (malformed email)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                rate_limited:
                  value:
                    error: "Too many requests"
                    message: "Please wait before requesting another password reset."
        '503':
          description: Email service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                service_unavailable:
                  value:
                    error: "Service unavailable"
                    message: "Please try again later."

  /api/password-reset/verify:
    post:
      tags:
        - Password Reset
      summary: Verify reset token
      description: |
        Validates a password reset token before showing the reset form.

        Use this endpoint to check if a token is valid before allowing
        the user to enter a new password.
      operationId: verifyResetToken
      security: []  # Public endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
            examples:
              valid:
                summary: Valid token
                value:
                  token: "abc123def456..."
      responses:
        '200':
          description: Token is valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenVerifyResponse'
              examples:
                valid:
                  value:
                    valid: true
                    email: "user@example.com"
                    expiresAt: "2025-12-31T12:30:00Z"
        '400':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                expired:
                  value:
                    error: "Token expired"
                    message: "This password reset link has expired. Please request a new one."
                invalid:
                  value:
                    error: "Invalid token"
                    message: "This password reset link is invalid."

  /api/password-reset/confirm:
    post:
      tags:
        - Password Reset
      summary: Reset password
      description: |
        Completes the password reset by setting a new password.

        **Actions performed:**
        - Validates token (not expired, not used)
        - Validates new password meets complexity requirements
        - Checks new password differs from current password
        - Updates user password
        - Invalidates all existing sessions (increments token_version)
        - Marks token as used
        - Sends confirmation email
      operationId: confirmPasswordReset
      security: []  # Public endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
            examples:
              valid:
                summary: Valid reset request
                value:
                  token: "abc123def456..."
                  newPassword: "NewSecurePass123"
      responses:
        '200':
          description: Password successfully reset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetConfirmResponse'
              examples:
                success:
                  value:
                    message: "Your password has been successfully reset. You can now log in with your new password."
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                weak_password:
                  value:
                    error: "Validation failed"
                    violations:
                      - field: "newPassword"
                        message: "Password must contain at least one uppercase letter"
                same_password:
                  value:
                    error: "Validation failed"
                    violations:
                      - field: "newPassword"
                        message: "New password must be different from your current password"
                expired_token:
                  value:
                    error: "Token expired"
                    message: "This password reset link has expired. Please request a new one."
                used_token:
                  value:
                    error: "Token already used"
                    message: "This password reset link has already been used."
        '403':
          description: Account disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                disabled:
                  value:
                    error: "Account disabled"
                    message: "This account has been disabled. Please contact support."

components:
  schemas:
    PasswordResetRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: Email address of the account to reset
          example: "user@example.com"

    PasswordResetRequestResponse:
      type: object
      properties:
        message:
          type: string
          description: Success message (always generic for security)
          example: "If an account exists with this email, a password reset link has been sent."

    TokenVerifyRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          description: The password reset token from the email link
          example: "YWJjMTIzZGVmNDU2Z2hpNzg5..."

    TokenVerifyResponse:
      type: object
      properties:
        valid:
          type: boolean
          description: Whether the token is valid
          example: true
        email:
          type: string
          format: email
          description: Email address associated with the token (masked for privacy)
          example: "u***r@example.com"
        expiresAt:
          type: string
          format: date-time
          description: When the token expires
          example: "2025-12-31T12:30:00Z"

    PasswordResetConfirmRequest:
      type: object
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          description: The password reset token from the email link
        newPassword:
          type: string
          minLength: 8
          description: |
            New password. Must meet complexity requirements:
            - Minimum 8 characters
            - At least one uppercase letter
            - At least one lowercase letter
            - At least one number
          example: "NewSecurePass123"

    PasswordResetConfirmResponse:
      type: object
      properties:
        message:
          type: string
          description: Success message
          example: "Your password has been successfully reset."

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error type
        message:
          type: string
          description: Human-readable error message

    ValidationError:
      type: object
      properties:
        error:
          type: string
          description: Error type
          example: "Validation failed"
        violations:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                description: Field that failed validation
              message:
                type: string
                description: Validation error message
